
<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Layout -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Page Identity -->
    <title>Snake</title>

    <meta
      name="description"
      content="Play Snake, a free classic arcade game with smooth animations, colorful graphics, sound effects, and mobile-friendly controls. Built by Fred Wahab."
    />

    <meta name="author" content="Fred Wahab" />
    <meta name="robots" content="index, follow" />

    <!-- Browser Appearance -->
    <meta name="theme-color" content="#101820" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    
    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://fredwahab.github.io/Snake/"
    />

    <!-- Open Graph: Social Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://fredwahab.github.io/Snake/"
    />
    <meta
      property="og:title"
      content="Snake | Classic Arcade Game"
    />
    <meta
      property="og:description"
      content="Play a modern take on classic Snake with smooth movement, colorful graphics, sound effects, and responsive controls."
    />
    <meta
      property="og:site_name"
      content="Fred Wahab Games"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Snake | Classic Arcade Game"
    />
    <meta
      name="twitter:description"
      content="Play classic Snake in your browser, on desktop or mobile."
    />

  </head>

  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
